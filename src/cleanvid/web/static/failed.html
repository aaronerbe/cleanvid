<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Failed Videos - Cleanvid</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <!-- Header -->
    <header class="bg-red-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-6">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-3xl font-bold">Failed Videos</h1>
                    <p class="text-red-100">Review and retry processing failures</p>
                </div>
                <a href="/" class="px-4 py-2 bg-red-700 hover:bg-red-800 rounded">← Back to Dashboard</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <!-- Controls -->
        <section class="bg-white rounded-lg shadow-md p-6 mb-8">
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
                <!-- Filter by Error Type -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Error Type</label>
                    <select id="errorFilter" onchange="filterResults()" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-red-500">
                        <option value="">All Error Types</option>
                        <!-- Populated by JavaScript -->
                    </select>
                </div>

                <!-- Sort By -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Sort By</label>
                    <select id="sortBy" onchange="filterResults()" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-red-500">
                        <option value="timestamp_desc">Newest First</option>
                        <option value="timestamp_asc">Oldest First</option>
                        <option value="name_asc">Name A-Z</option>
                        <option value="name_desc">Name Z-A</option>
                    </select>
                </div>

                <!-- Items per page -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Per Page</label>
                    <select id="perPage" onchange="filterResults()" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-red-500">
                        <option value="25">25</option>
                        <option value="50" selected>50</option>
                        <option value="100">100</option>
                        <option value="all">All</option>
                    </select>
                </div>

                <!-- Bulk Actions -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Bulk Actions</label>
                    <div class="flex gap-2">
                        <button id="bypassSelectedBtn" onclick="bypassSelected()" disabled
                                class="flex-1 px-3 py-2 bg-green-500 text-white rounded hover:bg-green-600 disabled:bg-gray-300 disabled:cursor-not-allowed text-sm">
                            Bypass
                        </button>
                        <button id="retrySelectedBtn" onclick="retrySelected()" disabled
                                class="flex-1 px-3 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 disabled:bg-gray-300 disabled:cursor-not-allowed text-sm">
                            Retry
                        </button>
                        <button id="resetSelectedBtn" onclick="resetSelected()" disabled
                                class="flex-1 px-3 py-2 bg-orange-500 text-white rounded hover:bg-orange-600 disabled:bg-gray-300 disabled:cursor-not-allowed text-sm">
                            Reset
                        </button>
                    </div>
                </div>
            </div>

            <!-- Second row: Reset All and Stats -->
            <div class="mt-4 pt-4 border-t border-gray-200">
                <div class="flex justify-between items-center">
                    <!-- Reset All Button -->
                    <button onclick="resetAllFailed()" class="px-4 py-2 bg-red-600 text-white rounded hover:bg-red-700">
                        🔄 Reset All Failed
                    </button>
                    
                    <!-- Stats -->
                    <div class="flex gap-8 text-center">
                        <div>
                            <div class="text-2xl font-bold text-gray-900" id="totalCount">0</div>
                            <div class="text-sm text-gray-600">Total Failed</div>
                        </div>
                        <div>
                            <div class="text-2xl font-bold text-red-600" id="filteredCount">0</div>
                            <div class="text-sm text-gray-600">Filtered Results</div>
                        </div>
                        <div>
                            <div class="text-2xl font-bold text-blue-600" id="selectedCount">0</div>
                            <div class="text-sm text-gray-600">Selected</div>
                        </div>
                        <div>
                            <div class="text-2xl font-bold text-purple-600" id="errorTypeCount">0</div>
                            <div class="text-sm text-gray-600">Error Types</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Failed Videos List -->
        <section class="bg-white rounded-lg shadow-md">
            <!-- Select All Header -->
            <div class="p-4 border-b border-gray-200 bg-gray-50">
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll()" class="w-5 h-5 rounded">
                    <span class="font-medium text-gray-700">Select All (filtered)</span>
                </label>
            </div>
            
            <div id="failedVideosList" class="divide-y">
                <!-- Populated by JavaScript -->
            </div>

            <!-- Pagination -->
            <div id="pagination" class="p-4 border-t border-gray-200 flex justify-between items-center">
                <!-- Populated by JavaScript -->
            </div>
        </section>
    </main>

    <script>
        let allFailures = [];
        let filteredFailures = [];
        let currentPage = 1;
        let selectedPaths = new Set();

        // Build a map of video_path -> error_type from the API response
        let errorTypeMap = {};

        function buildErrorTypeMap(errorGroups) {
            // Build reverse lookup: video_path -> error_type
            errorTypeMap = {};
            for (const [errorType, videos] of Object.entries(errorGroups)) {
                for (const video of videos) {
                    errorTypeMap[video.video_path] = errorType;
                }
            }
        }

        function getErrorType(failure) {
            // Use the pre-computed error type from API
            return errorTypeMap[failure.video_path] || 'Unknown Error';
        }

        // Load failed videos on page load
        loadFailedVideos();

        async function loadFailedVideos() {
            try {
                const response = await fetch('/api/failures');
                const data = await response.json();

                allFailures = data.failures || [];
                const errorGroups = data.error_groups || {};
                
                // Update stats
                document.getElementById('totalCount').textContent = allFailures.length;
                document.getElementById('errorTypeCount').textContent = Object.keys(errorGroups).length;

                // Build error type lookup map
                buildErrorTypeMap(errorGroups);

                // Populate error type filter
                populateErrorFilter(errorGroups);

                // Clear selections
                selectedPaths.clear();
                updateSelectionUI();

                // Initial filter
                filterResults();

            } catch (error) {
                console.error('Error loading failed videos:', error);
                document.getElementById('failedVideosList').innerHTML = 
                    '<div class="p-8 text-center text-red-600">Error loading failed videos</div>';
            }
        }

        function populateErrorFilter(errorGroups) {
            const select = document.getElementById('errorFilter');
            
            // Clear existing options except "All"
            while (select.options.length > 1) {
                select.remove(1);
            }

            // Sort error types by count (descending)
            const sortedTypes = Object.entries(errorGroups)
                .sort((a, b) => b[1].length - a[1].length);

            // Add error types with counts
            for (const [errorType, videos] of sortedTypes) {
                const option = document.createElement('option');
                option.value = errorType;
                option.textContent = `${errorType} (${videos.length})`;
                select.appendChild(option);
            }
        }

        function filterResults() {
            const errorFilter = document.getElementById('errorFilter').value;
            const sortBy = document.getElementById('sortBy').value;
            
            // Filter
            if (errorFilter === '') {
                filteredFailures = [...allFailures];
            } else {
                filteredFailures = allFailures.filter(f => 
                    getErrorType(f) === errorFilter
                );
            }

            // Sort
            filteredFailures.sort((a, b) => {
                switch(sortBy) {
                    case 'timestamp_desc':
                        return (b.timestamp || '').localeCompare(a.timestamp || '');
                    case 'timestamp_asc':
                        return (a.timestamp || '').localeCompare(b.timestamp || '');
                    case 'name_asc':
                        return getVideoName(a.video_path).localeCompare(getVideoName(b.video_path));
                    case 'name_desc':
                        return getVideoName(b.video_path).localeCompare(getVideoName(a.video_path));
                    default:
                        return 0;
                }
            });

            // Update filtered count
            document.getElementById('filteredCount').textContent = filteredFailures.length;

            // Reset to page 1
            currentPage = 1;

            // Update select all checkbox
            updateSelectAllCheckbox();

            // Render
            renderPage();
        }

        function renderPage() {
            const perPage = document.getElementById('perPage').value;
            const container = document.getElementById('failedVideosList');

            if (filteredFailures.length === 0) {
                container.innerHTML = '<div class="p-8 text-center text-gray-500">No failed videos found</div>';
                document.getElementById('pagination').innerHTML = '';
                return;
            }

            let paginated;
            let totalPages;

            if (perPage === 'all') {
                paginated = filteredFailures;
                totalPages = 1;
            } else {
                const itemsPerPage = parseInt(perPage);
                totalPages = Math.ceil(filteredFailures.length / itemsPerPage);
                const start = (currentPage - 1) * itemsPerPage;
                const end = start + itemsPerPage;
                paginated = filteredFailures.slice(start, end);
            }

            // Render videos
            container.innerHTML = paginated.map((failure, index) => {
                const videoName = getVideoName(failure.video_path);
                const errorType = getErrorType(failure);
                const timestamp = new Date(failure.timestamp).toLocaleString();
                const isChecked = selectedPaths.has(failure.video_path);
                const escapedPath = escapeQuotes(failure.video_path);

                return `
                    <div class="p-4 hover:bg-gray-50">
                        <div class="flex items-start gap-4">
                            <!-- Checkbox -->
                            <div class="pt-1">
                                <input type="checkbox" 
                                       class="video-checkbox w-5 h-5 rounded"
                                       data-path="${failure.video_path.replace(/"/g, '&quot;')}"
                                       ${isChecked ? 'checked' : ''}
                                       onchange="toggleSelection(this)">
                            </div>
                            
                            <!-- Content -->
                            <div class="flex-1">
                                <div class="flex items-center gap-3 mb-2">
                                    <h3 class="font-semibold text-gray-900">${videoName}</h3>
                                    <span class="px-2 py-1 bg-red-100 text-red-800 rounded text-xs font-semibold">${errorType}</span>
                                </div>
                                <div class="text-sm text-gray-600 mb-2">
                                    <span class="font-medium">Error:</span> ${failure.error || 'Unknown error'}
                                </div>
                                <div class="text-xs text-gray-500">
                                    Failed: ${timestamp}
                                </div>
                                <div class="text-xs text-gray-400 mt-1 font-mono truncate" title="${failure.video_path}">
                                    ${failure.video_path}
                                </div>
                            </div>
                            
                            <!-- Individual Actions -->
                            <div class="flex gap-2 ml-4">
                                <button onclick="bypassVideo('${escapedPath}')" 
                                        class="px-3 py-1 bg-green-500 text-white rounded hover:bg-green-600 text-sm whitespace-nowrap"
                                        title="Copy to output without processing">
                                    ➡️ Bypass
                                </button>
                                <button onclick="retryVideo('${escapedPath}')" 
                                        class="px-3 py-1 bg-blue-500 text-white rounded hover:bg-blue-600 text-sm whitespace-nowrap"
                                        title="Reset and add to processing queue">
                                    🔄 Retry
                                </button>
                                <button onclick="retryWithNewSrt('${escapedPath}')" 
                                        class="px-3 py-1 bg-purple-500 text-white rounded hover:bg-purple-600 text-sm whitespace-nowrap"
                                        title="Delete SRT and retry with fresh subtitles">
                                    📥 Retry + New SRT
                                </button>
                                <button onclick="resetVideo('${escapedPath}')" 
                                        class="px-3 py-1 bg-yellow-500 text-white rounded hover:bg-yellow-600 text-sm whitespace-nowrap"
                                        title="Remove from failed list">
                                    ↩️ Reset
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');

            // Render pagination
            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const pagination = document.getElementById('pagination');
            
            if (totalPages <= 1) {
                pagination.innerHTML = `<div class="text-sm text-gray-600">Showing all ${filteredFailures.length} results</div>`;
                return;
            }

            const pages = [];
            const maxVisible = 7;

            // Always show first page
            pages.push(1);

            if (totalPages <= maxVisible) {
                // Show all pages
                for (let i = 2; i <= totalPages; i++) {
                    pages.push(i);
                }
            } else {
                // Show ellipsis
                if (currentPage <= 4) {
                    for (let i = 2; i <= 5; i++) pages.push(i);
                    pages.push('...');
                    pages.push(totalPages);
                } else if (currentPage >= totalPages - 3) {
                    pages.push('...');
                    for (let i = totalPages - 4; i <= totalPages; i++) pages.push(i);
                } else {
                    pages.push('...');
                    pages.push(currentPage - 1);
                    pages.push(currentPage);
                    pages.push(currentPage + 1);
                    pages.push('...');
                    pages.push(totalPages);
                }
            }

            const buttons = pages.map(page => {
                if (page === '...') {
                    return '<span class="px-3 py-1 text-gray-400">...</span>';
                } else if (page === currentPage) {
                    return `<button class="px-3 py-2 bg-red-600 text-white rounded font-semibold">${page}</button>`;
                } else {
                    return `<button onclick="goToPage(${page})" class="px-3 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300">${page}</button>`;
                }
            }).join('');

            pagination.innerHTML = `
                <div class="flex gap-2">
                    <button onclick="goToPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''} 
                            class="px-3 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed">
                        ← Previous
                    </button>
                    ${buttons}
                    <button onclick="goToPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''} 
                            class="px-3 py-2 bg-gray-200 text-gray-700 rounded hover:bg-gray-300 disabled:opacity-50 disabled:cursor-not-allowed">
                        Next →
                    </button>
                </div>
                <div class="text-sm text-gray-600">
                    Page ${currentPage} of ${totalPages}
                </div>
            `;
        }

        function goToPage(page) {
            const perPage = document.getElementById('perPage').value;
            if (perPage === 'all') return;

            const totalPages = Math.ceil(filteredFailures.length / parseInt(perPage));
            
            if (page < 1 || page > totalPages) return;
            
            currentPage = page;
            renderPage();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Selection functions
        function toggleSelection(checkbox) {
            const path = checkbox.dataset.path;
            if (checkbox.checked) {
                selectedPaths.add(path);
            } else {
                selectedPaths.delete(path);
            }
            updateSelectionUI();
        }

        function toggleSelectAll() {
            const selectAll = document.getElementById('selectAllCheckbox').checked;
            
            if (selectAll) {
                // Select all filtered failures
                filteredFailures.forEach(f => selectedPaths.add(f.video_path));
            } else {
                // Deselect all filtered failures
                filteredFailures.forEach(f => selectedPaths.delete(f.video_path));
            }
            
            // Update checkboxes on current page
            document.querySelectorAll('.video-checkbox').forEach(cb => {
                cb.checked = selectAll;
            });
            
            updateSelectionUI();
        }

        function updateSelectAllCheckbox() {
            const selectAllCb = document.getElementById('selectAllCheckbox');
            const allFilteredSelected = filteredFailures.length > 0 && 
                filteredFailures.every(f => selectedPaths.has(f.video_path));
            selectAllCb.checked = allFilteredSelected;
        }

        function updateSelectionUI() {
            const count = selectedPaths.size;
            document.getElementById('selectedCount').textContent = count;
            
            // Enable/disable bulk action buttons
            const bypassBtn = document.getElementById('bypassSelectedBtn');
            const retryBtn = document.getElementById('retrySelectedBtn');
            const resetBtn = document.getElementById('resetSelectedBtn');
            
            bypassBtn.disabled = count === 0;
            retryBtn.disabled = count === 0;
            resetBtn.disabled = count === 0;
            
            // Update select all checkbox state
            updateSelectAllCheckbox();
        }

        // Helper functions
        function getVideoName(path) {
            return path.split('/').pop();
        }

        function escapeQuotes(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
        }

        // Individual action functions
        async function bypassVideo(videoPath) {
            if (!confirm(`Bypass ${getVideoName(videoPath)}?\n\nThis will copy directly to output without processing.`)) return;

            try {
                const response = await fetch('/api/bypass', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ video_path: videoPath })
                });

                const data = await response.json();

                if (data.success) {
                    showToast('✅ Video bypassed');
                    loadFailedVideos();
                } else {
                    alert('❌ Error: ' + (data.error || 'Bypass failed'));
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        async function retryVideo(videoPath) {
            if (!confirm(`Retry processing:\n${getVideoName(videoPath)}?`)) return;

            try {
                // Reset first
                await fetch('/api/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ video_path: videoPath })
                });

                // Add to queue
                const response = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ video_path: videoPath })
                });

                const data = await response.json();

                if (data.success) {
                    showToast('✅ Added to queue');
                    loadFailedVideos();
                } else {
                    alert('❌ Error: ' + (data.error || 'Failed to add to queue'));
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }
        
        async function retryWithNewSrt(videoPath) {
            if (!confirm(`Retry with NEW subtitles:\n${getVideoName(videoPath)}?\n\nThis will DELETE the existing SRT and download a fresh one from OpenSubtitles.`)) return;

            try {
                // Delete SRT first
                await fetch('/api/delete-srt', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ video_path: videoPath })
                });
                
                // Reset
                await fetch('/api/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ video_path: videoPath })
                });

                // Add to queue
                const response = await fetch('/api/process', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ video_path: videoPath })
                });

                const data = await response.json();

                if (data.success) {
                    showToast('✅ SRT deleted, added to queue');
                    loadFailedVideos();
                } else {
                    alert('❌ Error: ' + (data.error || 'Failed to add to queue'));
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        async function resetVideo(videoPath) {
            if (!confirm(`Reset status for:\n${getVideoName(videoPath)}?`)) return;

            try {
                const response = await fetch('/api/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ video_path: videoPath })
                });

                const data = await response.json();

                if (data.success) {
                    showToast('✅ Video reset');
                    loadFailedVideos();
                } else {
                    showToast('ℹ️ ' + data.message);
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        // Bulk action functions
        async function bypassSelected() {
            const count = selectedPaths.size;
            if (count === 0) {
                alert('Please select at least one video');
                return;
            }

            if (!confirm(`Bypass ${count} selected video(s)?\n\nThese will be added to the bypass queue and copied to output without processing.`)) return;

            try {
                const paths = Array.from(selectedPaths);
                
                const response = await fetch('/api/bypass-multiple', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ video_paths: paths })
                });

                const data = await response.json();

                if (data.success) {
                    showToast(`✅ ${data.queued} video(s) added to bypass queue`);
                    loadFailedVideos();
                } else {
                    alert('❌ Error: ' + (data.error || 'Bypass failed'));
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        async function retrySelected() {
            const count = selectedPaths.size;
            if (count === 0) {
                alert('Please select at least one video');
                return;
            }

            if (!confirm(`Retry ${count} selected video(s)?\n\nThese will be reset and added to the processing queue.`)) return;

            try {
                const paths = Array.from(selectedPaths);
                let resetCount = 0;
                let queuedCount = 0;

                // Reset all first
                for (const path of paths) {
                    try {
                        const response = await fetch('/api/reset', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ video_path: path })
                        });
                        const data = await response.json();
                        if (data.success) resetCount++;
                    } catch {
                        // Continue on error
                    }
                }

                // Add all to queue
                for (const path of paths) {
                    try {
                        const response = await fetch('/api/process', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ video_path: path })
                        });
                        const data = await response.json();
                        if (data.success) queuedCount++;
                    } catch {
                        // Continue on error
                    }
                }

                alert(`✅ Reset ${resetCount}, queued ${queuedCount} video(s)`);
                loadFailedVideos();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        async function resetSelected() {
            const count = selectedPaths.size;
            if (count === 0) {
                alert('Please select at least one video');
                return;
            }

            if (!confirm(`Reset ${count} selected video(s)?\n\nThis will remove them from the failed list so they can be reprocessed.`)) return;

            try {
                const paths = Array.from(selectedPaths);
                let successCount = 0;
                let failCount = 0;

                for (const path of paths) {
                    try {
                        const response = await fetch('/api/reset', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ video_path: path })
                        });
                        const data = await response.json();
                        if (data.success) {
                            successCount++;
                        } else {
                            failCount++;
                        }
                    } catch {
                        failCount++;
                    }
                }

                if (failCount === 0) {
                    showToast(`✅ Reset ${successCount} video(s)`);
                } else {
                    showToast(`Reset ${successCount}, failed ${failCount}`);
                }
                
                loadFailedVideos();
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }

        async function resetAllFailed() {
            const count = allFailures.length;
            
            if (!confirm(`🔄 Reset ALL ${count} failed video(s)?\n\nThis will remove them from the processed log so they can be reprocessed.`)) return;

            try {
                const response = await fetch('/api/reset-failed', {
                    method: 'POST'
                });

                const data = await response.json();

                if (data.success) {
                    showToast(`✅ Reset ${data.count} failed video(s)`);
                    loadFailedVideos();
                } else {
                    alert('❌ Error resetting videos');
                }
            } catch (error) {
                alert('❌ Error: ' + error.message);
            }
        }
        
        // Toast notification helper
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-4 right-4 bg-green-600 text-white px-4 py-2 rounded-lg shadow-lg z-50 transition-opacity duration-300';
            toast.textContent = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 2500);
        }
    </script>
</body>
</html>
